<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
<title>Boekenkast</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boekenkast">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
/* Layout: iOS-native stack navigation — large titles, grouped inset lists, floating glass tab bar */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#e9e9ee; --fg:#000; --fg2:rgba(60,60,67,.62); --fg3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.18); --accent:#007aff; --green:#34c759; --red:#ff3b30; --gold:#c79a3b;
  --glass:rgba(250,250,252,.72); --glass-b:rgba(0,0,0,.08); --shadow:0 8px 30px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --round:-apple-system-ui-rounded,ui-rounded,"SF Pro Rounded",var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#fff; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --accent:#0a84ff; --green:#30d158; --red:#ff453a; --gold:#d6ad55;
  --glass:rgba(40,40,44,.62); --glass-b:rgba(255,255,255,.1); --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#fff; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --accent:#0a84ff; --green:#30d158; --red:#ff453a; --gold:#d6ad55;
  --glass:rgba(40,40,44,.62); --glass-b:rgba(255,255,255,.1); --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:8px 140px}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:6px;margin-inline:-4px}
.topbar .sp{flex:1}
.pill{height:44px;min-width:44px;padding:0 16px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:.5px solid var(--glass-b);font-weight:500}
.pill.icon{padding:0;width:44px}
.pill svg{width:22px;height:22px}
.pill.gold{color:var(--gold);font-weight:600}
h1.large{font-size:34px;font-weight:700;letter-spacing:.2px;margin:6px 0 14px;text-wrap:balance}
h2.sec{font-size:22px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between}
.cap{font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--fg2);margin:24px 16px 8px}
/* grouped list */
.group{background:var(--card);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:52px;padding:8px 16px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.row .ico{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none}
.row .ico svg{width:22px;height:22px}
.row .lbl{flex:1;min-width:0}
.row .val{color:var(--fg2);font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.row .chev{color:var(--fg3);width:14px;height:14px;flex:none}
.row.big{min-height:64px}
.row input,.row select,.row textarea{flex:1;min-width:0;border:0;background:transparent;text-align:right;outline:none;padding:6px 0}
.row textarea{text-align:left;resize:vertical;min-height:70px}
.row.danger{color:var(--red);justify-content:center}
.row.accent{color:var(--accent)}
/* now reading */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;padding-block:4px 10px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.nowcard{scroll-snap-align:start;flex:0 0 calc(100% - 28px);border-radius:28px;position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;padding:16px;color:#fff;min-height:150px;text-align:left}
.nowcard .bgimg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.4) brightness(.75);transform:scale(1.2)}
.nowcard>*:not(.bgimg){position:relative}
.nowcard .cov{width:76px;flex:none}
.nowcard .meta{flex:1;min-width:0}
.nowcard .t{font-weight:700;font-size:18px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nowcard .a{opacity:.85;font-size:15px;margin-top:2px}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.35);flex:0 0 70px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff}
.play{width:54px;height:54px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none}
.play svg{width:22px;height:22px}
.empty{color:var(--fg2);text-align:center;padding:28px 20px;background:var(--card);border-radius:22px}
/* covers */
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;background:var(--card2);box-shadow:0 2px 10px rgba(0,0,0,.18);max-width:100%}
.cover img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block;background:var(--card2)}
.cover .ph[data-hide]{visibility:hidden}
.cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10% 9%;color:#fff;font-weight:700;line-height:1.15}
.cover .ph .pt{font-size:clamp(11px,3.3vw,16px);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;font-family:Georgia,"Times New Roman",serif}
.cover .ph .pa{font-size:clamp(9px,2.4vw,12px);font-weight:500;opacity:.85}
.ced{display:flex;justify-content:center;padding:4px 0 2px}
.ced-frame{width:min(62vw,270px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ced-frame:active{cursor:grabbing}
.ced-frame img{pointer-events:none;background:transparent}
.ced-grid{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
  background-image:linear-gradient(to right,rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.4) 1px,transparent 1px);background-size:33.34% 33.34%;background-position:-1px -1px}
.ced-ctl{display:flex;align-items:center;gap:12px;padding:10px 16px}
.ced-ctl+.ced-ctl{border-top:.5px solid var(--sep)}
.ced-ctl span{flex:none;width:70px;font-size:15px}
.ced-ctl b{flex:none;width:56px;text-align:right;font-weight:500;color:var(--fg2);font-variant-numeric:tabular-nums;font-size:15px}
.ced-ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.editable{cursor:pointer}
.badge{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;background:rgba(30,30,30,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.badge svg{width:15px;height:15px}
.badge.fav{left:6px;right:auto;color:#ff6482}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid button{text-align:left;min-width:0}
.grid .gt{font-size:13px;margin-top:6px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--fg2);font-weight:600;gap:10px}
.toolbar button{color:var(--fg);font-weight:600;letter-spacing:.5px;display:flex;gap:6px;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:0 12px;height:40px;margin-bottom:14px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0}
.search svg{width:18px;height:18px;color:var(--fg2);flex:none}
/* detail */
.hero{position:relative;margin:-8px -16px 0;padding:calc(env(safe-area-inset-top,0px) + 70px) 16px 26px;text-align:center;overflow:hidden;color:#fff}
.hero .bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3) brightness(.8);transform:scale(1.3)}
.hero>*:not(.bgimg){position:relative}
.hero .cover{width:46%;max-width:220px;margin:0 auto;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.hero h1{font-size:25px;line-height:1.2;margin:20px 0 6px;text-wrap:balance}
.hero .au{opacity:.85;font-size:18px}
.pagechip{position:absolute;right:8px;bottom:8px;background:rgba(60,60,60,.75);color:#fff;font-size:13px;padding:4px 10px;border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.actions{display:flex;justify-content:center;gap:30px;margin-top:22px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:15px;color:#fff}
.act span.c{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center}
.act.primary span.c{background:#fff;color:#000}
.act svg{width:26px;height:26px}
.hero .back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;color:#fff;background:rgba(255,255,255,.22)}
.hero .more{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;color:#fff;background:rgba(255,255,255,.22)}
.progcard{background:var(--card);border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px}
.progcard .pc{flex:1;min-width:0}
.progcard .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.progcard .sub{color:var(--fg2);font-size:15px;margin-top:2px}
.ring{width:72px;height:72px;flex:none}
.stars{display:flex;gap:4px}
.stars button svg{width:24px;height:24px}
.stars .on{color:#ff9f0a}.stars .off{color:var(--fg3)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:12px;justify-content:center;pointer-events:none}
.tabs,.fab{pointer-events:auto;background:var(--glass);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border:.5px solid var(--glass-b);box-shadow:var(--shadow)}
.tabs{display:flex;border-radius:34px;padding:5px;flex:1;max-width:460px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:28px;font-size:11px;font-weight:600;color:var(--fg)}
.tab svg{width:26px;height:26px}
.tab.on{background:var(--card2);color:var(--accent)}
.fab{width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
/* sheets & modals */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--fg3);margin:0 auto 12px}
.sheet h3{text-align:center;margin:4px 0 14px;font-size:17px}
.sheet .btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:52px;border-radius:26px;background:var(--card2);font-weight:600}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.blue{background:var(--accent);color:#fff}
.btn.red{color:var(--red)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:80;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:.5px solid var(--glass-b);box-shadow:var(--shadow);padding:10px 18px;border-radius:22px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center}
/* reading mode */
.reader{position:fixed;inset:0;z-index:60;color:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden;background:#222}
.reader .bgimg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.3) brightness(.7);transform:scale(1.3)}
.reader>*:not(.bgimg){position:relative}
.reader .top{width:100%;display:flex;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.reader .top .pill{color:#fff;background:rgba(255,255,255,.2)}
.reader .cover{width:min(52vw,250px);margin-top:6vh;border-radius:18px}
.reader .goal{margin-top:5vh;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600}
.reader .goal svg{width:28px;height:28px}
.reader .time{font:200 min(24vw,110px)/1 var(--round);font-variant-numeric:tabular-nums;margin-top:8px;letter-spacing:-1px}
.reader .ctrls{display:flex;gap:36px;margin-top:auto;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.reader .ctrls .act span.c{width:84px;height:84px}
.reader .ctrls .act svg{width:32px;height:32px}
/* scanner */
.scanner{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .frame{position:absolute;left:12%;right:12%;top:34%;height:18%;border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.scanner .top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px}
.scanner .top .pill{color:#fff;background:rgba(255,255,255,.2)}
.scanner .panel{position:relative;margin-top:auto;background:var(--bg);color:var(--fg);border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:48vh;overflow:auto}
.scanned{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
.scanned .cover{width:44px;flex:none;border-radius:6px}
.scanned .m{flex:1;min-width:0;font-size:15px}
.scanned .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dup{color:var(--red);font-size:13px;font-weight:600}
.okc{color:var(--green);font-size:13px;font-weight:600}
/* cover search */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cgrid button{position:relative}
.cgrid .src{font-size:11px;color:var(--fg2);margin-top:4px;text-align:center}
.paste{border:1.5px dashed var(--fg3);border-radius:18px;padding:18px;text-align:center;color:var(--fg2);margin-top:12px;outline:none}
.paste:focus{border-color:var(--accent)}
.hint{color:var(--fg2);font-size:13px;margin:8px 16px 0;line-height:1.4}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:22px;padding:16px}
.tile .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--round)}
.tile .l{color:var(--fg2);font-size:14px}
.chart{background:var(--card);border-radius:22px;padding:16px}
.chart svg{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px}
.seg button{flex:1;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{background:var(--card2);border-radius:14px;padding:3px 10px;font-size:14px}
.note{padding:12px 16px}
.note+.note{border-top:.5px solid var(--sep)}
.note small{color:var(--fg2);display:block;margin-bottom:2px}
.spinner{width:28px;height:28px;border:3px solid var(--fg3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.result{display:flex;gap:12px;align-items:center;padding:10px 16px;width:100%;text-align:left}
.result+.result{border-top:.5px solid var(--sep)}
.result .cover{width:46px;flex:none;border-radius:6px}
.result .m{flex:1;min-width:0}
.result .m b{display:block;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.result .m span{color:var(--fg2);font-size:14px}
.field{display:flex;gap:8px;margin-bottom:12px}
.field input{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:var(--card2);padding:0 14px;outline:none}
.field .btn{flex:none;height:44px;padding:0 18px}
</style>
</head>

<div id="app"></div>
<div id="layer"></div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";
/* ---------- icons ---------- */
const I={
 books:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="8.5" y="4" width="4" height="16" rx="1"/><path d="M14.2 5.2l3.4-.9a1 1 0 011.2.7l3.4 13.2a1 1 0 01-.7 1.2l-3.4.9a1 1 0 01-1.2-.7L13.5 6.4a1 1 0 01.7-1.2z"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3.1 4.5 6.9 4.5c2.2 0 3.6 1.2 5.1 3 1.5-1.8 2.9-3 5.1-3 3.8 0 6 3.8 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>',

 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>',

 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>',

  document.documentElement.lang=LANG;const th=S.settings.theme;if(th==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",th)}
async function saveSettings(){await DB.set("settings",S.settings);applySettings()}
async function saveBook(b){const i=S.books.findIndex(x=>x.id===b.id);if(i<0)S.books.push(b);else S.books[i]=b;await DB.put(b)}

/* ---------- cover rendering ---------- */
const PALS=[["#5b3a8c","#2b1b47"],["#1f5f8b","#0e2c42"],["#8b2f3c","#3f141b"],["#2f6b4f","#123224"],["#8a6a1f","#3d2e0b"],["#3d4a8c","#1a2047"],["#7a3d6b","#36192f"],["#2d6a73","#0f2f33"]];
function hash(s){let h=0;for(const c of s||"")h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function coverTransform(T){return `transform:translate(${T.x}%,${T.y}%) rotate(${T.r}deg) scale(${T.s})`}
function setCover(b,u){b.cover=u;delete b.coverT;delete b.coverTried}
function coverHTML(b,cls=""){const p=PALS[hash(b.title)%PALS.length];
  const tr=b.cover&&b.coverT;
  const ph=`<div class="ph"${tr?" data-hide":""} style="background:linear-gradient(160deg,${p[0]},${p[1]})"><div class="pt">${esc(b.title||t("noTitle"))}</div><div class="pa">${esc(b.author)}</div></div>`;
  const fail="var p=this.parentNode.querySelector('.ph');if(p)p.removeAttribute('data-hide');this.remove()";
  const img=b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy"${tr?` style="${coverTransform(b.coverT)}"`:""} onerror="${fail}" onload="if(this.naturalWidth<10){${fail}}">`:"";
  return `<div class="cover ${cls}">${ph}${img}</div>`}
function bgStyle(b){return b.cover?`style="background-image:url('${esc(b.cover).replace(/'/g,"%27")}')"`:`style="background:linear-gradient(160deg,${PALS[hash(b.title)%PALS.length].join(",")})"`}

/* ---------- navigation ---------- */
function go(v,p={}){S.stack.push({v,...p});render();window.scrollTo(0,0)}
function back(){if(S.stack.length>1)S.stack.pop();render()}
function cur(){return S.stack[S.stack.length-1]}
function setTab(tab){S.tab=tab;S.stack=[{v:tab==="books"?"home":tab}];render();window.scrollTo(0,0)}

const FILTERS={owned:b=>b.status!=="wishlist",wishlist:b=>b.status==="wishlist",toread:b=>b.status==="toread",reading:b=>b.status==="reading",finished:b=>b.status==="finished",abandoned:b=>b.status==="abandoned",favorites:b=>b.favorite,nocover:b=>!b.cover,all:b=>true};
function filterFn(f){return f.startsWith("c:")?(b=>(b.collections||[]).includes(f.slice(2))):FILTERS[f]}
function filterName(f){return f.startsWith("c:")?f.slice(2):t(f)}
const FICON={owned:I.books,all:I.books,wishlist:I.heart,toread:I.fwd,reading:I.open,finished:I.check,abandoned:I.close,favorites:I.star,nocover:I.photo};

/* ---------- views ---------- */
function vHome(){
  const reading=S.books.filter(b=>b.status==="reading").sort((a,b)=>(b.lastRead||b.start||"").localeCompare(a.lastRead||a.start||""));
  let h=`<div class="topbar"><button class="pill icon" data-a="settings" aria-label="${t("settings")}">${I.gear}</button><div class="sp"></div><button class="pill icon" data-a="add" aria-label="${t("addBook")}">${I.plus}</button></div>
  <h1 class="large">${t("library")}</h1>`;
  if(!S.books.length){h+=`<div class="empty"><b>${t("emptyLib")}</b><p>${t("emptyHint")}</p>
     <div class="btnrow" style="display:flex;flex-direction:column;gap:10px">
     ${window.SEED_CSV?`<button class="btn blue" data-a="seed">${t("loadSeed")}</button>`:""}
     <label class="btn" style="display:grid;place-items:center;cursor:pointer">${t("importCsv")}<input type="file" accept=".zip,.csv,application/zip,application/x-zip-compressed,text/csv,text/comma-separated-values" data-imp="bookshelf" hidden></label><button class="btn" data-a="add">${t("addBook")}</button></div></div>`;return h}
  h+=`<h2 class="sec">${t("nowReading")}</h2>`;
  if(reading.length){h+=`<div class="carousel">`+reading.map(b=>{const pct=b.pages?Math.min(100,b.progress/b.pages*100):0;
    return `<div class="nowcard" data-a="open" data-id="${b.id}" role="button" tabindex="0"><div class="bgimg" ${bgStyle(b)}></div>${coverHTML(b,"cov")}
    <div class="meta"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div>
    <div class="prog"><div class="bar"><i style="width:${pct}%"></i></div>${t("page")} ${b.progress||0}</div></div>
    <button class="play" data-a="read" data-id="${b.id}" aria-label="${t("readMode")}">${I.play}</button></div>`}).join("")+`</div>`}
  else h+=`<div class="empty">${t("nothingReading")}</div>`;
  const rowF=(k,icon)=>{const n=S.books.filter(filterFn(k)).length;return `<button class="row big" data-a="list" data-f="${esc(k)}"><span class="ico">${icon}</span><span class="lbl">${esc(filterName(k))}</span><span class="val">${n}</span><span class="chev">${I.chev}</span></button>`};
  h+=`<h2 class="sec">${t("collection")}</h2><div class="group" style="--inset:74px">`+["owned","wishlist","toread","reading","finished"].map(k=>rowF(k,FICON[k])).join("")+`</div>`;
  const cols=[...new Set(S.books.flatMap(b=>b.collections||[]))].sort();
  const extra=["favorites",...(S.books.some(FILTERS.abandoned)?["abandoned"]:[]),...(S.books.some(FILTERS.nocover)?["nocover"]:[]),"all"];
  h+=`<h2 class="sec">${t("more")}</h2><div class="group" style="--inset:74px">`+cols.map(c=>rowF("c:"+c,I.open.replace('fill="currentColor"','fill="none" stroke="currentColor" stroke-width="2"'))).join("")+extra.map(k=>rowF(k,FICON[k])).join("")+`</div>`;
  return h}

function sortBooks(list){const s=S.sort;return list.sort((a,b)=>s==="title"?a.title.localeCompare(b.title):s==="author"?(a.author||"").localeCompare(b.author||""):s==="year"?(b.year||0)-(a.year||0):(b.added||"").localeCompare(a.added||""))}
function vList(p){
  const q=S.q.toLowerCase();let list=S.books.filter(filterFn(p.f));
  if(q)list=list.filter(b=>(b.title+" "+b.author+" "+b.isbn).toLowerCase().includes(q));
  sortBooks(list);
  return `<div class="topbar"><button class="pill icon" data-a="back" aria-label="Back">${I.back}</button><div class="sp"></div><button class="pill icon" data-a="add" aria-label="${t("addBook")}">${I.plus}</button></div>
  <h1 class="large">${esc(filterName(p.f))}</h1>
  <div class="search">${I.search}<input id="q" type="search" placeholder="${t("searchLib")}" value="${esc(S.q)}" autocomplete="off"></div>
  <div class="toolbar"><span>${list.length} ${t("books_n")}</span><button data-a="sort">${t("sort")} ${I.sort.replace("<svg","<svg width=16 height=16")}</button></div>
  ${p.f==="nocover"&&list.length?`<button class="btn blue" style="width:100%;margin-bottom:14px" data-a="fetchcovers">${t("fetchCovers")}</button><p class="hint" style="margin:-6px 4px 14px">${t("nocoverHint")}</p>`:""}<div class="grid" id="grid">${gridHTML(list,p.f==="nocover"?"quickcover":"open")}</div>`}
function gridHTML(list,act="open"){return list.map(b=>`<button data-a="${act}" data-id="${b.id}" aria-label="${esc(b.title)}"><div style="position:relative">${coverHTML(b)}${b.status==="finished"?`<span class="badge">${I.check}</span>`:""}${b.favorite?`<span class="badge fav">${I.heart}</span>`:""}</div><div class="gt">${esc(b.title)}</div></button>`).join("")||`<p style="color:var(--fg2);grid-column:1/-1">${t("noResults")}</p>`}

function ring(pct){const r=30,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--card2)" stroke-width="8"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)">${Math.round(pct)}%</text></svg>`}
function vDetail(p){const b=byId(p.id);if(!b)return vHome();
  const pct=b.pages?Math.min(100,(b.progress||0)/b.pages*100):0;
  const mins=(b.sessions||[]).reduce((a,s)=>a+s.minutes,0);
  const row=(l,v)=>`<div class="row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`;
  return `<div class="hero"><div class="bgimg" ${bgStyle(b)}></div>
   <button class="pill icon back" data-a="back" aria-label="Back">${I.back}</button><button class="pill icon more" data-a="bookmenu" data-id="${b.id}" aria-label="Menu">${I.more}</button>
   <div style="position:relative;width:46%;max-width:220px;margin:0 auto"${b.cover?` class="editable" data-a="editcover" data-id="${b.id}" role="button" aria-label="${t("adjustCover")}"`:""}>${coverHTML(b).replace('class="cover "','class="cover " style="width:100%;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35)"')}${b.status==="reading"?`<span class="pagechip">${t("page")} ${b.progress||0}</span>`:""}</div>
   <h1>${esc(b.title)}</h1><div class="au">${esc(b.author||t("unknownAuthor"))}</div>
   <div class="actions"><button class="act primary" data-a="read" data-id="${b.id}"><span class="c">${I.play}</span>${t("readMode")}</button>
   <button class="act" data-a="status" data-id="${b.id}"><span class="c">${FICON[b.status]}</span>${t(b.status)}</button>
   <button class="act" data-a="edit" data-id="${b.id}"><span class="c">${I.pencil}</span>${t("edit")}</button></div></div>
  <h2 class="sec">${t("progress")}</h2>
  <div class="progcard"><div class="pc"><div class="big">${b.pages?t("pagesRead",{a:b.progress||0,b:b.pages}):t("noPages")}</div>
   <div class="sub">${mins?`${mins} ${t("min")} · ${(b.sessions||[]).length} ${t("sessions").toLowerCase()}`:""}</div>
   <button class="row accent" style="padding:8px 0 0;min-height:0" data-a="setpage" data-id="${b.id}">${t("updatePage")}</button></div>${b.pages?ring(pct):""}</div>
  <div class="cap">${t("rating")}</div><div class="group"><div class="row"><span class="stars">${[1,2,3,4,5].map(n=>`<button data-a="rate" data-id="${b.id}" data-n="${n}" class="${n<=b.rating?"on":"off"}" aria-label="${n}">${I.star}</button>`).join("")}</span><span class="lbl"></span><button data-a="fav" data-id="${b.id}" style="color:${b.favorite?"#ff375f":"var(--fg3)"};width:28px" aria-label="${t("favorite")}">${I.heart}</button></div></div>
  <div class="cap">${t("details")}</div><div class="group">
   ${row(t("isbn"),esc(b.isbn||"–"))}${row(t("publisher"),esc(b.publisher||"–"))}${row(t("year"),b.year||"–")}${row(t("pages"),b.pages||"–")}
   ${row(t("format"),t(b.format||"hardcover"))}${row(t("ownership"),t(b.owned||"owned"))}
   <div class="row"><span class="lbl">${t("categories")}</span><span class="chips">${(b.categories||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join("")||'<span class="val">–</span>'}</span></div>
   ${(b.collections||[]).length?`<div class="row"><span class="lbl">${t("collections")}</span><span class="chips">${b.collections.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</span></div>`:""}${row(t("added"),fmtDate(b.added))}${row(t("started"),fmtDate(b.start))}${row(t("ended"),fmtDate(b.end))}</div>
  <div class="cap">${t("notes")}</div><div class="group">${(b.notes||[]).map(n=>`<div class="note"><small>${fmtDate(n.date)}${n.page?` · ${t("page")} ${n.page}`:""}</small>${esc(n.text)}</div>`).join("")||`<div class="note" style="color:var(--fg2)">${t("noNotes")}</div>`}
   <button class="row accent" data-a="addnote" data-id="${b.id}" style="border-top:.5px solid var(--sep)">${t("addNote")}</button></div>
  <div class="group" style="margin-top:28px"><button class="row danger" data-a="delbook" data-id="${b.id}">${t("deleteBook")}</button></div>`}

function vEdit(p){const b=p.id?byId(p.id):p.draft;if(!b)return vHome();
  const inp=(k,l,type="text")=>`<label class="row"><span class="lbl" style="flex:none">${l}</span><input id="f_${k}" type="${type}" value="${esc(b[k]||"")}" ${type==="number"?'inputmode="numeric"':""}></label>`;
  const sel=(k,l,opts)=>`<label class="row"><span class="lbl">${l}</span><select id="f_${k}">${opts.map(o=>`<option value="${o}" ${b[k]===o?"selected":""}>${t(o)}</option>`).join("")}</select></label>`;
  return `<div class="topbar"><button class="pill" data-a="back">${t("cancel")}</button><div class="sp"></div><button class="pill" style="color:var(--accent);font-weight:700" data-a="saveedit">${t("save")}</button></div>
  <h1 class="large">${p.id?t("edit"):t("newBook")}</h1>
  <div style="display:flex;gap:16px;align-items:center"><div style="width:96px;flex:none">${coverHTML(b)}</div>
   <div style="display:flex;flex-direction:column;gap:8px;flex:1"><button class="btn blue" data-a="coversearch">${t("findCover")}</button>${b.cover?`<button class="btn" data-a="editcoverdraft">${t("adjustCover")}</button><button class="btn red" data-a="rmcover">${t("removeCover")}</button>`:""}</div></div>
  <div class="cap">${t("details")}</div><div class="group">${inp("title",t("title"))}${inp("author",t("author"))}${inp("isbn",t("isbn"))}${inp("publisher",t("publisher"))}${inp("year",t("year"),"number")}${inp("pages",t("pages"),"number")}
   <label class="row"><span class="lbl" style="flex:none">${t("categories")}</span><input id="f_categories" value="${esc((b.categories||[]).join(", "))}"></label>
   <label class="row"><span class="lbl" style="flex:none">${t("collections")}</span><input id="f_collections" placeholder="${t("collectionsPh")}" value="${esc((b.collections||[]).join(", "))}"></label></div>
  <div class="cap">${t("status")}</div><div class="group">${sel("status",t("status"),["toread","reading","finished","wishlist","abandoned"])}${sel("format",t("format"),["hardcover","paperback","ebook","audiobook"])}${sel("owned",t("ownership"),["owned","notOwned","borrowed"])}</div>`}

function vStats(){
  const y=new Date().getFullYear();const all=S.books.flatMap(b=>(b.sessions||[]));
  const fin=S.books.filter(b=>b.status==="finished"&&b.end&&new Date(b.end).getFullYear()===y);
  const pagesY=all.filter(s=>new Date(s.date).getFullYear()===y).reduce((a,s)=>a+Math.max(0,(s.to||0)-(s.from||0)),0)+fin.filter(b=>!(b.sessions||[]).length).reduce((a,b)=>a+(b.pages||0),0);
  const tot=all.reduce((a,s)=>a+s.minutes,0);
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=dayKey(d);return {l:d.toLocaleDateString(LANG==="nl"?"nl-NL":"en-GB",{weekday:"short"}).slice(0,2),v:all.filter(s=>dayKey(s.date)===k).reduce((a,s)=>a+s.minutes,0)}});
  const months=[...Array(12)].map((_,m)=>({l:new Date(y,m,1).toLocaleDateString(LANG==="nl"?"nl-NL":"en-GB",{month:"narrow"}),v:fin.filter(b=>new Date(b.end).getMonth()===m).length}));
  const bars=(data,unit)=>{const W=320,H=150,top=18,bottom=22,max=Math.max(1,...data.map(d=>d.v));const bw=W/data.length;
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${top+(H-top-bottom)*(1-f)}" y2="${top+(H-top-bottom)*(1-f)}" stroke="var(--sep)" stroke-width="1"/>`).join("")}
    ${data.map((d,i)=>{const h=(H-top-bottom)*d.v/max;const x=i*bw+bw*.2;return `<rect x="${x}" y="${H-bottom-h}" width="${bw*.6}" height="${Math.max(h,d.v?2:0)}" rx="4" fill="var(--accent)"/>${d.v?`<text x="${x+bw*.3}" y="${H-bottom-h-5}" text-anchor="middle" font-size="11" fill="var(--fg2)">${d.v}</text>`:""}<text x="${x+bw*.3}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--fg2)">${esc(d.l)}</text>`}).join("")}</svg>`};
  return `<h1 class="large" style="margin-top:56px">${t("stats")}</h1>
  <div class="tiles"><div class="tile"><div class="n">${fin.length}</div><div class="l">${t("yearBooks",{y})}</div></div>
  <div class="tile"><div class="n">${pagesY.toLocaleString(LANG)}</div><div class="l">${t("yearPages",{y})}</div></div>
  <div class="tile"><div class="n">${Math.floor(tot/60)}u ${tot%60}m</div><div class="l">${t("totalTime")}</div></div>
  <div class="tile"><div class="n">${streak(all,new Date())}</div><div class="l">${t("streak")}</div></div></div>
  <div class="cap">${t("last7")} (${t("min")})</div><div class="chart">${bars(days)}</div>
  <div class="cap">${t("perMonth",{y})}</div><div class="chart">${bars(months)}</div>`}

function vSettings(){const st=S.settings;
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-a="setopt" data-k="${k}" data-v="${v}" class="${String(st[k])===v?"on":""}">${l}</button>`).join("")}</div>`;
  return `<div class="topbar"><button class="pill icon" data-a="back" aria-label="Back">${I.back}</button></div>
  <h1 class="large">${t("settings")}</h1>
  <div class="cap">${t("language")}</div><div class="group"><div class="row">${seg("lang",[["auto",t("auto")],["nl","Nederlands"],["en","English"]])}</div></div>
  <div class="cap">${t("appearance")}</div><div class="group"><div class="row">${seg("theme",[["system",t("system")],["light",t("light")],["dark",t("dark")]])}</div></div>
  <div class="cap">${t("readMode")}</div><div class="group">
   <label class="row"><span class="lbl">${t("dailyGoal")}</span><input id="s_goal" type="number" inputmode="numeric" value="${st.goal}" style="max-width:80px"></label>
   <label class="row" style="flex-wrap:wrap"><span class="lbl" style="flex-basis:100%">${t("playlistUrl")}</span><input id="s_playlist" type="url" placeholder="https://open.spotify.com/playlist/…" value="${esc(st.playlist)}" style="text-align:left"></label></div>
  <p class="hint">${t("playlistHint")}</p>
  <div class="cap">${t("sources")}</div><div class="group">
   <label class="row" style="flex-wrap:wrap"><span class="lbl" style="flex-basis:100%">${t("gbKey")}</span><input id="s_gbkey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${DEFAULT_GB_KEY?t("gbBuiltin"):"AIza…"}" value="${esc(st.gbKey||"")}" style="text-align:left"></label></div>
  <p class="hint">${t("gbKeyHint")}</p>
  <div class="cap">${t("data")}</div><div class="group">
   <label class="row accent" style="cursor:pointer">${t("importCsv")}<input type="file" accept=".zip,.csv,application/zip,application/x-zip-compressed,text/csv,text/comma-separated-values" data-imp="bookshelf" hidden></label>
   <button class="row accent" data-a="fetchcovers">${t("fetchCovers")} (${S.books.filter(b=>!b.cover).length})</button>
   <button class="row accent" data-a="exportjson">${t("exportJson")}</button>
   <label class="row accent" style="cursor:pointer">${t("importJson")}<input type="file" accept=".json,application/json" data-imp="backup" hidden></label>
   ${window.SEED_CSV?`<button class="row accent" data-a="seed">${t("loadSeed")}</button>`:""}
   <button class="row" style="color:var(--red)" data-a="deleteall">${t("deleteAll")}</button></div>
  <p class="hint">${t("install")}</p>
  <p class="hint">${S.books.length} ${t("books_n")} · ${t("version")} 0.9</p>`}

/* ---------- render ---------- */
function render(){const c=cur();let h="";
  if(c.v==="home")h=vHome();else if(c.v==="list")h=vList(c);else if(c.v==="detail")h=vDetail(c);else if(c.v==="edit")h=vEdit(c);
  else if(c.v==="stats")h=vStats();else if(c.v==="settings")h=vSettings();
  $("#app").innerHTML=`<div class="wrap">${h}</div>`+(c.v==="edit"||c.v==="settings"?"":tabbar());
  const q=$("#q");if(q)q.addEventListener("input",e=>{S.q=e.target.value;const list=sortBooks(S.books.filter(filterFn(cur().f)).filter(b=>(b.title+" "+b.author+" "+b.isbn).toLowerCase().includes(S.q.toLowerCase())));$("#grid").innerHTML=gridHTML(list,cur().f==="nocover"?"quickcover":"open");$(".toolbar span").textContent=list.length+" "+t("books_n")});
  ["s_goal","s_playlist","s_gbkey"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("change",()=>{const k={s_goal:"goal",s_playlist:"playlist",s_gbkey:"gbKey"}[id];S.settings[k]=id==="s_goal"?Math.max(1,parseInt(el.value)||30):el.value.trim();if(id==="s_gbkey")GB_OFF=false;saveSettings();toast(t("saved"))})});
}
function tabbar(){return `<nav class="tabbar"><div class="tabs">
  <button class="tab ${S.tab==="books"?"on":""}" data-a="tab" data-t="books">${I.books}${t("books")}</button>
  <button class="tab ${S.tab==="stats"?"on":""}" data-a="tab" data-t="stats">${I.stats}${t("stats")}</button></div>
  <button class="fab" data-a="add" aria-label="${t("addBook")}">${I.plus}</button></nav>`}

/* ---------- sheets ---------- */
function sheet(html,onClose){const L=$("#layer");const w=document.createElement("div");w.className="scrim";w.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;

async function olBulk(isbns){const out={};isbns=[...new Set(isbns.filter(Boolean))];

  const m=await olBulk(isbnVariants(isbn));const d=Object.values(m)[0];if(d)return olDataToBook(d,isbn);
  const j=await gbJSON(`q=isbn:${isbn}`);if(j.items&&j.items.length){const b=gbToBook(j.items[0]);b.isbn=isbn;return b}
  return null}

  const j=await gbJSON(`maxResults=20&q=${encodeURIComponent(q)}`);(j.items||[]).forEach(v=>out.push(gbToBook(v)));
  if(!out.length){try{const j2=await getJSON(`https://openlibrary.org/search.json?limit=20&fields=title,author_name,isbn,publisher,first_publish_year,number_of_pages_median,cover_i&q=${encodeURIComponent(q)}`);(j2.docs||[]).forEach(d=>out.push({title:d.title,author:(d.author_name||[]).join(", "),isbn:cleanIsbn((d.isbn||[]).find(x=>x.length===13)||(d.isbn||[])[0]),publisher:(d.publisher||[])[0]||"",year:d.first_publish_year||0,pages:d.number_of_pages_median||0,categories:[],cover:d.cover_i?olCover(d.cover_i):""}))}catch(e){}}

function jsonp(url,ms=9000){return new Promise((res,rej)=>{const cb="jp"+Math.random().toString(36).slice(2);const sc=document.createElement("script");

const words=x=>(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2&&!["the","and","van","het","een","der","des","les"].includes(w));

  return (j.results||[]).filter(r=>r.artworkUrl100).map(r=>({url:r.artworkUrl100.replace(/\/\d+x\d+(bb)?\.(jpg|png|webp)$/,"/1000x1000bb.jpg"),title:r.trackName||"",author:r.artistName||""}))}catch(e){return []}}
async function bookcoverApi(b){if(BC_OFF)return [];const base="https://bookcover.longitood.com/bookcover";const urls=[];
  const i13=b.isbn?isbn13(b.isbn):"";if(i13.length===13)urls.push(`${base}?isbn=${i13}`);
  if(b.title&&b.author)urls.push(`${base}?book_title=${encodeURIComponent(shortTitle(b.title))}&author_name=${encodeURIComponent(b.author.split(",")[0])}`);

function openCoverEditor(b,onSave){

  const clamp=(v,a,z)=>Math.min(z,Math.max(a,v));const norm=r=>{r=((r+180)%360+360)%360-180;return Math.round(r*10)/10};
  const w=sheet(`<h3>${t("adjustCover")}</h3>
   <div class="ced"><div class="cover ced-frame" id="cedf"><img id="cedi" src="${esc(b.cover)}" alt="" draggable="false"><div class="ced-grid"></div></div></div>
   <p class="hint" style="text-align:center;margin:10px 16px 14px">${t("cedHint")}</p>
   <div class="group">
    <label class="ced-ctl"><span>${t("zoom")}</span><input type="range" id="ceds" min="0.3" max="5" step="0.01"><b id="cedsv"></b></label>
    <label class="ced-ctl"><span>${t("rotation")}</span><input type="range" id="cedr" min="-180" max="180" step="0.1"><b id="cedrv"></b></label></div>
   <div class="btnrow"><button class="btn" id="cedl" aria-label="-90">↺ 90°</button><button class="btn" id="cedrr" aria-label="+90">↻ 90°</button><button class="btn" id="ced0">${t("reset")}</button></div>
   <div class="btnrow"><button class="btn" data-x="0">${t("cancel")}</button><button class="btn blue" data-x="1">${t("save")}</button></div>`,()=>done());
  const fr=w.querySelector("#cedf"),img=w.querySelector("#cedi"),sS=w.querySelector("#ceds"),sR=w.querySelector("#cedr");
  const apply=()=>{img.style.transform=`translate(${st.x}%,${st.y}%) rotate(${st.r}deg) scale(${st.s})`;
    sS.value=st.s;sR.value=norm(st.r);w.querySelector("#cedsv").textContent=Math.round(st.s*100)+"%";w.querySelector("#cedrv").textContent=norm(st.r).toFixed(1)+"°"};
  sS.oninput=()=>{st.s=+sS.value;apply()};sR.oninput=()=>{st.r=+sR.value;apply()};
  w.querySelector("#cedl").onclick=()=>{st.r=norm(st.r-90);apply()};w.querySelector("#cedrr").onclick=()=>{st.r=norm(st.r+90);apply()};
  w.querySelector("#ced0").onclick=()=>{Object.assign(st,{s:1,x:0,y:0,r:0});apply()};

      st.s=clamp(g.st.s*Math.hypot(c.x-a.x,c.y-a.y)/g.d,0.3,5);st.r=g.st.r+(Math.atan2(c.y-a.y,c.x-a.x)-g.ang)*180/Math.PI;

  function done(){document.removeEventListener("gesturestart",noZoom);document.removeEventListener("gesturechange",noZoom)}

    const T={s:Math.round(st.s*1000)/1000,x:Math.round(st.x*100)/100,y:Math.round(st.y*100)/100,r:norm(st.r)};

  <div class="top"><button class="pill icon" id="scx" aria-label="${t("cancel")}">${I.close}</button><b>${t("scan")}</b><span style="width:44px"></span></div>
  <div class="panel"><div class="grab"></div><h3 style="margin:4px 0 6px">${t("scanned")} <span id="scn" style="color:var(--fg2)">0</span></h3><p class="hint" style="margin:0 0 6px" id="schint">${t("scanHint")}</p><div id="sclist"></div>
  <button class="btn primary" id="scadd" style="width:100%;margin-top:12px" hidden></button></div>`;
  document.body.appendChild(el);
  const found=[];const seen=new Set();const video=el.querySelector("video");
  const draw=()=>{el.querySelector("#scn").textContent=found.length;
    el.querySelector("#sclist").innerHTML=found.map(f=>`<div class="scanned">${coverHTML(f.b||{title:f.isbn})}<div class="m"><b>${esc(f.b?f.b.title:f.isbn)}</b>${f.loading?`<span class="okc" style="color:var(--fg2)">${t("lookup")}</span>`:f.dup?`<span class="dup">${t("alreadyHave")}</span>`:f.b&&f.b.title?`<span class="okc">${t("willAdd")} · ${esc(f.b.author)}</span>`:`<span class="dup" style="color:var(--fg2)">${t("notFound")}</span>`}</div></div>`).reverse().join("");
    const n=found.filter(f=>!f.dup&&!f.loading).length;const btn=el.querySelector("#scadd");btn.hidden=!n;btn.textContent=t("addN",{n})};
  const onCode=async code=>{const isbn=cleanIsbn(code);if(!(isbn.length===13||isbn.length===10)||seen.has(isbn))return;seen.add(isbn);
    if(navigator.vibrate)navigator.vibrate(40);
    const dupB=findDuplicate(S.books,{isbn,title:""});const f={isbn,loading:!dupB,dup:!!dupB,b:dupB||null};found.push(f);draw();
    if(!dupB){const b=await lookupIsbn(isbn);f.loading=false;f.b=b||{title:"",isbn};f.b.isbn=isbn;
      const d2=findDuplicate(S.books,f.b);if(d2){f.dup=true;f.b=d2}draw()}};
  let stream=null,raf=null,zx=null,stopped=false;
  scanStop=()=>{stopped=true;if(raf)cancelAnimationFrame(raf);if(zx)try{zx.reset()}catch(e){};if(stream)stream.getTracks().forEach(t=>t.stop());el.remove();scanStop=null};
  el.querySelector("#scx").onclick=()=>scanStop();
  el.querySelector("#scadd").onclick=async()=>{const add=found.filter(f=>!f.dup&&!f.loading).map(f=>newBook(Object.assign({},f.b,{isbn:f.isbn,title:f.b.title||f.isbn})));
    for(const b of add)await saveBook(b);scanStop();toast(t("imported",{n:add.length,d:found.filter(f=>f.dup).length}));render()};
  try{
    if("BarcodeDetector" in window){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280}}});video.srcObject=stream;await video.play();
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a"]});
      const loop=async()=>{if(stopped)return;try{const r=await det.detect(video);r.forEach(x=>onCode(x.rawValue))}catch(e){}raf=requestAnimationFrame(()=>setTimeout(loop,120))};loop();
    }else if(window.ZXing){
      const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A]);
      zx=new ZXing.BrowserMultiFormatReader(hints,250);
      await zx.decodeFromConstraints({video:{facingMode:"environment",width:{ideal:1280}}},video,(res)=>{if(res)onCode(res.getText())});
      stream=video.srcObject;
    }else throw new Error("no scanner")
  }catch(e){el.querySelector("#schint").textContent=t("cameraErr");el.querySelector("#schint").style.color="var(--red)"}
}

/* ---------- reading mode ---------- */
let tick=null,wake=null;
function elapsed(s){return Math.max(0,((s.pausedAt||Date.now())-s.start-s.pausedTotal)/1000)}
function todayMinutes(){const k=dayKey(new Date());return S.books.flatMap(b=>b.sessions||[]).filter(s=>dayKey(s.date)===k).reduce((a,s)=>a+s.minutes,0)}
async function startReading(id){if(!S.session||S.session.bookId!==id){S.session={bookId:id,start:Date.now(),pausedTotal:0,pausedAt:null};await DB.set("session",S.session)}
  const b=byId(id);if(b.status!=="reading"){b.status="reading";if(!b.start)b.start=new Date().toISOString();await saveBook(b)}
  showReader()}
function showReader(){const s=S.session;const b=byId(s.bookId);if(!b){S.session=null;DB.set("session",null);return}
  const el=document.createElement("div");el.className="reader";el.id="reader";
  el.innerHTML=`<div class="bgimg" ${bgStyle(b)}></div>
  <div class="top"><button class="pill icon" id="rx" aria-label="${t("cancel")}">${I.close}</button><div style="flex:1"></div>
   ${S.settings.playlist?`<a class="pill" href="${esc(S.settings.playlist)}" target="_blank" rel="noopener" style="color:#fff;background:rgba(255,255,255,.2);text-decoration:none">${I.music}${t("playlist")}</a>`:""}
   <button class="pill" id="rf" style="font-weight:700">${t("finish")}</button></div>
  <div style="position:relative">${coverHTML(b)}<span class="pagechip">${t("fromPage",{n:b.progress||0})}</span></div>
  <div class="goal" id="rgoal"></div><div class="time" id="rtime">0:00</div>
  <div class="ctrls"><button class="act" id="rnote"><span class="c">${I.note}</span>${t("addNote")}</button>
   <button class="act primary" id="rp"><span class="c" id="rpi"></span><span id="rpl"></span></button></div>`;
  document.body.appendChild(el);
  const upd=()=>{const e=elapsed(S.session);const m=Math.floor(e/60),sec=Math.floor(e%60),h=Math.floor(m/60);
    el.querySelector("#rtime").textContent=h?`${h}:${String(m%60).padStart(2,"0")}:${String(sec).padStart(2,"0")}`:`${m}:${String(sec).padStart(2,"0")}`;
    const left=Math.ceil(S.settings.goal-todayMinutes()-e/60);
    el.querySelector("#rgoal").innerHTML=left>0?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>${t("goal",{n:left})}`:`${I.check.replace("<svg",'<svg style="width:26px;height:26px"')}${t("goalDone")}`;
    const p=!!S.session.pausedAt;el.querySelector("#rpi").innerHTML=p?I.play:I.pause;el.querySelector("#rpl").textContent=p?t("resume"):t("pause")};
  upd();clearInterval(tick);tick=setInterval(upd,500);
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(e){}
  const close=()=>{clearInterval(tick);el.remove();try{wake&&wake.release()}catch(e){};render()};
  el.querySelector("#rp").onclick=async()=>{const s=S.session;if(s.pausedAt){s.pausedTotal+=Date.now()-s.pausedAt;s.pausedAt=null}else s.pausedAt=Date.now();await DB.set("session",s);upd()};
  el.querySelector("#rx").onclick=async()=>{if(await confirmSheet(LANG==="nl"?"Sessie stoppen zonder op te slaan?":"Stop session without saving?",LANG==="nl"?"Stoppen":"Stop",true)){S.session=null;await DB.set("session",null);close()}};
  el.querySelector("#rnote").onclick=async()=>{const txt=await textSheet(t("addNote"),t("notePh"));if(txt){b.notes=b.notes||[];b.notes.push({date:new Date().toISOString(),text:txt,page:b.progress||0});await saveBook(b);toast(t("saved"))}};
  el.querySelector("#rf").onclick=async()=>{const s=S.session;if(!s.pausedAt){s.pausedAt=Date.now()}const mins=Math.max(1,Math.round(elapsed(s)/60));
    const pg=await numberSheet(t("untilPage"),b.progress||0);if(pg===null){if(s.pausedAt&&!s._wasPaused){s.pausedTotal+=Date.now()-s.pausedAt;s.pausedAt=null}upd();return}
    b.sessions=b.sessions||[];b.sessions.push({date:new Date(s.start).toISOString(),minutes:mins,from:b.progress||0,to:pg});b.progress=pg;b.lastRead=new Date().toISOString();
    if(b.pages&&pg>=b.pages&&await confirmSheet(t("markFinished"),t("yes"))){b.status="finished";b.end=new Date().toISOString()}
    await saveBook(b);S.session=null;await DB.set("session",null);close();toast(t("sessionSaved",{m:mins}))};
}

/* ---------- import / export ---------- */
async function importFiles(parts){/* parts: {books:text, history:text|null, collections:text|null} */
  const rows=parseCSV(parts.books);const res=mergeImport(S.books,rows,parts.history?parseCSV(parts.history):[],parts.collections?parseCSV(parts.collections):[]);
  await DB.putMany(res.added.concat(res.updated));S.books.push(...res.added);
  toast(t("importedU",{n:res.added.length,u:res.updated.length}));render();fetchMissingCovers(res.added.concat(res.updated))}
async function importUpload(f){toast(t("importing"));try{
  if(/\.zip$/i.test(f.name)||f.type.includes("zip")){const z=await JSZip.loadAsync(f);const files=Object.values(z.files).filter(x=>!x.dir&&/\.csv$/i.test(x.name)&&!/__MACOSX/.test(x.name));
    const find=re=>files.find(x=>re.test(x.name.split("/").pop()));const bk=find(/books/i)||files[0];if(!bk)throw new Error("no csv");
    const h=find(/reading.?history/i),c=find(/collections/i);
    await importFiles({books:await bk.async("string"),history:h?await h.async("string"):null,collections:c?await c.async("string"):null})}
  else await importFiles({books:await f.text()})}catch(e){toast(t("importErr"))}}
let coverRun=null;
async function findCoverSingle(b){
  const tl=shortTitle(b.title);const au=(b.author||"").split(",")[0].trim();const T=7000;
  const i10=b.isbn?isbn10(b.isbn):"";const pick=a=>a&&a.length?a:"";
  const srcs=[
    /* in priority order; all run at the same time */
    i10?imgOk(amazonCover(i10),T).then(ok=>ok?amazonCover(i10):""):"",
    b.isbn&&!GB_OFF?gbJSON(`q=isbn:${cleanIsbn(b.isbn)}`).then(j=>(j.items||[]).map(v=>gbToBook(v).cover).find(Boolean)||""):"",
    bookcoverApi(b).then(a=>a[0]||""),
    tl?olSearchCovers(`title=${encodeURIComponent(tl)}${au?"&author="+encodeURIComponent(au):""}`,5).then(d=>{const x=d.find(y=>y.cover_i);return x?olCover(x.cover_i):""}):"",
    tl?appleBooks(tl+(au?" "+au:""),8).then(r=>{const x=r.find(y=>titleMatch(b.title,y.title));return x?x.url:""}):"",
    tl&&!GB_OFF?gbJSON(`maxResults=5&q=${encodeURIComponent("intitle:"+tl+(au?" inauthor:"+au.split(" ").pop():""))}`).then(j=>{const g=(j.items||[]).map(gbToBook).find(x=>x.cover&&titleMatch(b.title,x.title));return g?g.cover:""}):"",
    tl&&au?olSearchCovers(`title=${encodeURIComponent(tl)}`,5).then(d=>{const x=d.find(y=>y.cover_i&&titleMatch(b.title,y.title));return x?olCover(x.cover_i):""}):""
  ].map(p=>within(p,T+1000,""));
  const out=await Promise.all(srcs);return pick(out.find(Boolean))}
async function waitVisible(){if(!document.hidden)return;await new Promise(r=>{const h=()=>{if(!document.hidden){document.removeEventListener("visibilitychange",h);r()}};document.addEventListener("visibilitychange",h)})}
async function fetchMissingCovers(list,force){if(coverRun){if(force)toast(t("coversBusy"));return}
  list=(list||S.books).filter(b=>!b.cover&&(force||!b.coverTried||(b.coverV||1)<COVER_V));if(!list.length){if(force)toast(t("coversNone"));return}
  coverRun={done:0,found:0,total:list.length};const bar=document.createElement("div");bar.className="toast";bar.style.top="auto";bar.style.bottom="calc(env(safe-area-inset-bottom,0px) + 96px)";document.body.appendChild(bar);
  bar.style.cursor="pointer";bar.onclick=()=>{coverRun.stop=true;bar.textContent=t("coversStopping")};
  const upd=()=>{if(!coverRun.stop)bar.textContent=t("coversProgress",{d:coverRun.done,n:coverRun.total,f:coverRun.found})+" · "+t("tapStop")};upd();
  let lastRender=0;const refresh=(now)=>{if((now||Date.now()-lastRender>2500)&&cur().v!=="edit"&&!$("#layer").children.length){lastRender=Date.now();const y=window.scrollY;render();window.scrollTo(0,y)}};
  /* phase 1: bulk ISBN lookup at Open Library (a few requests for the whole library) */
  const withIsbn=list.filter(b=>b.isbn);
  if(withIsbn.length){await waitVisible();const m=await olBulk(withIsbn.flatMap(b=>isbnVariants(b.isbn)));
    for(const b of withIsbn){const d=isbnVariants(b.isbn).map(x=>m[x]).find(x=>x&&x.cover);if(d){b.cover=olDataToBook(d,"").cover;coverRun.found++;coverRun.done++;await DB.put(b)}}
    upd();refresh(true)}
  /* phase 2: the rest one by one, by title and author */
  const queue=list.filter(x=>!x.cover);
  const worker=async()=>{while(queue.length&&!coverRun.stop){const b=queue.shift();await waitVisible();
    let c="";try{c=await findCoverSingle(b)}catch(e){}
    if(c){b.cover=c;coverRun.found++;delete b.coverTried}else{b.coverTried=Date.now();b.coverV=COVER_V}
    await DB.put(b);coverRun.done++;upd();refresh();await sleep(300)}};
  await Promise.all([worker(),worker(),worker()]);
  bar.remove();toast(t("coversDone",{f:coverRun.found,n:coverRun.total}));coverRun=null;if(cur().v!=="edit")render()}
function pickFile(accept){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept=accept;i.style.cssText="position:fixed;left:-9999px;opacity:0";document.body.appendChild(i);i.addEventListener("change",()=>{res(i.files[0]);i.remove()},{once:true});i.click()})}
async function exportJSON(){const data=JSON.stringify({app:"boekenkast",version:1,exported:new Date().toISOString(),books:S.books,settings:S.settings},null,1);
  const blob=new Blob([data],{type:"application/json"});const f=new File([blob],`boekenkast-backup-${dayKey(new Date())}.json`,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});toast(t("backupMade"));return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast(t("backupMade"))}
async function importJSON(file){const f=file||await pickFile("application/json,.json");if(!f)return;try{const j=JSON.parse(await f.text());const add=[];let d=0;
  for(const b of j.books||[]){if(findDuplicate(S.books.concat(add),b)){d++;continue}add.push(b)}await DB.putMany(add);S.books.push(...add);toast(t("imported",{n:add.length,d}));render()}catch(e){toast("JSON?")}}

/* ---------- actions ---------- */
document.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  if(el.closest(".nowcard")&&a==="open"&&e.target.closest(".play"))return;
  switch(a){
  case "tab":setTab(el.dataset.t);break;
  case "back":back();break;
  case "list":S.q="";go("list",{f:el.dataset.f});break;
  case "open":go("detail",{id});break;
  case "editcover":{const b=byId(id);if(b&&b.cover)openCoverEditor(b,async T=>{if(T)b.coverT=T;else delete b.coverT;await saveBook(b);render()});break}
  case "editcoverdraft":{const c=cur();const b=c.id?byId(c.id):c.draft;readForm(b);if(b.cover)openCoverEditor(b,T=>{if(T)b.coverT=T;else delete b.coverT;render()});break}
  case "quickcover":{const b=byId(id);openCoverSearch(b,async u=>{setCover(b,u);await saveBook(b);const y=window.scrollY;render();window.scrollTo(0,y)});break}
  case "settings":go("settings");break;
  case "add":addFlow();break;
  case "read":e.stopPropagation();startReading(id);break;
  case "edit":go("edit",{id});break;
  case "sort":{const v=await menuSheet(t("sort"),["added","title","author","year"].map(k=>({label:t("s_"+k),value:k,on:S.sort===k})));if(v){S.sort=v;render()}break}
  case "status":{const b=byId(id);const v=await menuSheet(t("status"),["toread","reading","finished","wishlist","abandoned"].map(k=>({label:t(k),icon:FICON[k],value:k,on:b.status===k})));
    if(v){b.status=v;if(v==="reading"&&!b.start)b.start=new Date().toISOString();if(v==="finished"){b.end=b.end||new Date().toISOString();if(b.pages)b.progress=b.pages}if(v==="wishlist"&&b.owned==="owned")b.owned="notOwned";if(v!=="wishlist"&&b.owned==="notOwned")b.owned="owned";await saveBook(b);render()}break}
  case "bookmenu":{const v=await menuSheet(byId(id).title,[{label:t("edit"),icon:I.pencil,value:"edit"},{label:t("findCover"),icon:I.photo,value:"cover"},...(byId(id).cover?[{label:t("adjustCover"),icon:I.sort,value:"adjust"}]:[]),{label:t("deleteBook"),value:"del",danger:true}]);
    if(v==="edit")go("edit",{id});if(v==="cover"){const b=byId(id);openCoverSearch(b,async u=>{setCover(b,u);await saveBook(b);render()})}if(v==="adjust"){const b=byId(id);openCoverEditor(b,async T=>{if(T)b.coverT=T;else delete b.coverT;await saveBook(b);render()})}if(v==="del"&&await confirmSheet(t("confirmDelete"),t("delete"),true)){S.books=S.books.filter(b=>b.id!==id);await DB.del(id);back()}break}
  case "setpage":{const b=byId(id);const v=await numberSheet(t("untilPage"),b.progress||0);if(v!==null){b.progress=v;b.lastRead=new Date().toISOString();if(b.status==="toread"||b.status==="wishlist"){b.status="reading";b.start=b.start||new Date().toISOString()}
    if(b.pages&&v>=b.pages&&b.status!=="finished"&&await confirmSheet(t("markFinished"),t("yes"))){b.status="finished";b.end=new Date().toISOString()}await saveBook(b);render();toast(t("progressSaved"))}break}
  case "rate":{const b=byId(id);const n=+el.dataset.n;b.rating=b.rating===n?0:n;await saveBook(b);render();break}
  case "fav":{const b=byId(id);b.favorite=!b.favorite;await saveBook(b);render();break}
  case "addnote":{const b=byId(id);const txt=await textSheet(t("addNote"),t("notePh"));if(txt){b.notes=b.notes||[];b.notes.push({date:new Date().toISOString(),text:txt,page:b.progress||0});await saveBook(b);render()}break}
  case "delbook":{if(await confirmSheet(t("confirmDelete"),t("delete"),true)){S.books=S.books.filter(b=>b.id!==id);await DB.del(id);back()}break}
  case "coversearch":{const c=cur();const b=c.id?byId(c.id):c.draft;readForm(b);openCoverSearch(b,u=>{setCover(b,u);render()});break}
  case "rmcover":{const c=cur();const b=c.id?byId(c.id):c.draft;readForm(b);setCover(b,"");render();break}
  case "saveedit":{const c=cur();const b=c.id?byId(c.id):c.draft;readForm(b);if(!b.title){toast(t("title")+"?");break}
    if(!c.id){const d=findDuplicate(S.books,b);if(d){const v=await menuSheet(t("duplicateWarn"),[{label:t("openExisting"),value:"open"},{label:t("addAnyway"),value:"add"}]);if(v==="open"){S.stack.pop();go("detail",{id:d.id});break}if(v!=="add")break}}
    if(b.status==="finished"&&b.pages&&!b.progress)b.progress=b.pages;if(b.status==="finished"&&!b.end)b.end=new Date().toISOString();if(b.status==="reading"&&!b.start)b.start=new Date().toISOString();
    await saveBook(b);S.stack.pop();if(!c.id)go("detail",{id:b.id});else render();toast(t("saved"));break}
  case "setopt":S.settings[el.dataset.k]=el.dataset.v;await saveSettings();render();break;
  case "importcsv":{const f=await pickFile(".csv,.zip,text/csv,application/zip");if(f)importUpload(f);break}
  case "seed":importFiles(window.SEED_CSV);break;
  case "exportjson":exportJSON();break;
  case "fetchcovers":fetchMissingCovers(null,true);break;
  case "importjson":importJSON();break;
  case "deleteall":if(await confirmSheet(t("confirmDeleteAll"),t("delete"),true)){await DB.clear();S.books=[];render()}break;
  }});
function readForm(b){const v=k=>{const el=document.getElementById("f_"+k);return el?el.value.trim():undefined};
  ["title","author","publisher","status","format","owned"].forEach(k=>{const x=v(k);if(x!==undefined)b[k]=x});
  const isbn=v("isbn");if(isbn!==undefined)b.isbn=cleanIsbn(isbn);
  ["year","pages"].forEach(k=>{const x=v(k);if(x!==undefined)b[k]=parseInt(x)||0});
  const c=v("categories");if(c!==undefined)b.categories=c.split(",").map(s=>s.trim()).filter(Boolean);const co=v("collections");if(co!==undefined)b.collections=co.split(",").map(s=>s.trim()).filter(Boolean)}
document.addEventListener("change",e=>{const i=e.target;if(!(i.matches&&i.matches("input[data-imp]")))return;const f=i.files&&i.files[0];const kind=i.dataset.imp;i.value="";if(!f)return;
  if(kind==="bookshelf")importUpload(f);else importJSON(f)});
document.addEventListener("keydown",e=>{const el=e.target.closest&&e.target.closest(".nowcard");if(el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();go("detail",{id:el.dataset.id})}});

/* ---------- boot ---------- */
(async()=>{await DB.open();try{S.books=(await DB.all())||[]}catch(e){S.books=[]}
  try{const st=await DB.get("settings");if(st)Object.assign(S.settings,st)}catch(e){}
  applySettings();render();
  try{S.session=await DB.get("session")||null;if(S.session&&byId(S.session.bookId))showReader()}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  setTimeout(()=>fetchMissingCovers(),1500);
  if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
